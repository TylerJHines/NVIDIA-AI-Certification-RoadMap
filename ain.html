questions'};page='exams';render()}function submitQuestions(){if(exam.answers.includes(null)&&!confirm('Some questions are unanswered. Continue to labs?'))return;exam.phase='labs';begin(exam.labIds[0],true)}function finishExam(){let correct=exam.questions.filter((q,i)=>q.options[exam.answers[i]]?.ok).length,qPct=Math.round(correct/exam.questions.length*100),lPct=Math.round(exam.labs.reduce((s,x)=>s+x.score,0)/3);exam.score=Math.round((qPct+lPct)/2);exam.qPct=qPct;exam.lPct=lPct;exam.phase='results';save('exam-'+exam.n,{score:exam.score,qPct,lPct,date:new Date().toISOString()});page='exams';active=null;render()}function tabs(){return `<nav class="nav">${[['home','Dashboard'],['labs','Guided Lab Simulator'],['terminal','Terminal'],['commands','Command Academy'],['exams','Mock Exams']].map(([p,t])=>`<button class="${page===p?'active':''}" onclick="choose('${p}')">${t}</button>`).join('')}</nav>`}function content(){if(page==='home'){let done=Object.keys(get('completions')||{}).length;return `<h1>AI Networking Command Center</h1><p class="sub">The same practice workflow as the NCP-AIO simulator: guided troubleshooting, a terminal, command academy, hints, completion tracking and four mock exams.</p><div class="grid"><div class="card"><h2>${done}/${LABS.length} labs completed</h2><p>InfiniBand, Spectrum Ethernet, RoCE, and Kubernetes networking</p><button class="primary" onclick="choose('labs')">Open guided labs</button></div><div class="card"><h2>4 × 30 questions + 3 labs</h2><p>Original practice tests. Labs selected from the scenario library.</p><button class="primary" onclick="choose('exams')">Mock exam center</button></div></div>`}if(page==='labs'){let done=get('completions')||{};return `<h1>AI Networking Lab Library</h1><p class="sub">${LABS.length} guided, stateful simulated scenarios with progress tracking and command hints.</p><div class="grid">${LABS.map(l=>`<div class="card"><span class="tag">${esc(l.domain)}</span><h2>${esc(l.name)}</h2><p>${esc(l.story)}</p>${done[l.id]?`<p class="success">✓ Completed · ${done[l.id].score}%</p>`:''}<button class="primary" onclick="begin('${l.id}')">${done[l.id]?'Practice again':'Start guided lab'}</button></div>`).join('')}</div>`}if(page==='commands'){let all=[...new Set(LABS.flatMap(l=>l.steps.map(s=>s[2])))];return `<h1>Networking Command Academy</h1><p class="sub">Learn what each command does before attempting the labs. simctl commands are training-only actions, not NVIDIA or switch commands.</p><div class="grid">${all.map(cmd=>{let st=LABS.flatMap(l=>l.steps).find(s=>s[2]===cmd);return `<div class="card"><h3><code>${esc(cmd)}</code></h3><p>${esc(st[3])}</p></div>`}).join('')}</div>`}if(page==='terminal'){if(!active)return `<h1>Lab workspace</h1><p>Select a guided lab to start.</p><button onclick="choose('labs')">Choose lab</button>`;let l=LABS.find(x=>x.id===active.id),st=l.steps[active.at];return `<h1>Lab workspace</h1><p class="sub">${esc(l.name)} · ${active.at}/${l.steps.length} objectives complete</p><div class="grid"><div class="card"><h2>Scenario checklist</h2><p>${esc(l.story)}</p>${l.steps.map((s,i)=>`<div class="checkrow ${i<active.at?'success':''}">${i<active.at?'✓':i===active.at?'→':'○'} <strong>${esc(s[0])}</strong> — ${esc(s[3])}</div>`).join('')}<p>${st?'Current objective: '+esc(st[3]):'All objectives completed.'}</p><details><summary>Show next command hint</summary><p><code>${esc(st?.[2]||'Complete')}</code></p><p>To count a hint against your lab score, enter <code>hint</code> in the terminal.</p></details><button class="primary" onclick="finish()">${active.fromExam?'Submit exam lab':'Finish lab'}</button></div><div class="card"><h2>Simulated terminal</h2><pre class="terminal">${esc(active.history.join('\n\n')||'Training switch/fabric connected. Type help to inspect supported commands.')}</pre><form onsubmit="event.preventDefault();command(this.cmd.value);this.cmd.value=''"><input name="cmd" autocomplete="off" placeholder="Enter command" aria-label="Terminal command"><button class="primary" type="submit">Run</button></form><p class="muted">Commands execute against a synthetic scenario, never real networking equipment.</p></div></div>`}if(page==='exams'){if(!exam)return `<h1>NCP-AIN Mock Exam Center</h1><p class="sub">Four 30-question practice exams, each followed by three randomly selected labs. 50/50 scoring is a training choice, not official NVIDIA exam weighting.</p><div class="grid">${[0,1,2,3].map(n=>`<div class="card"><h2>Mock exam ${n+1}</h2><p>${get('exam-'+n)?.score??'Not attempted'}${get('exam-'+n)?'%':''}</p><button class="primary" onclick="startExam(${n})">Start mock</button></div>`).join('')}</div>`;if(exam.phase==='results')return `<h1>Mock ${exam.n+1} results</h1><div class="card"><h2>${exam.score}%</h2><p>Questions: ${exam.qPct}% · Labs: ${exam.lPct}%</p><p>Practice benchmark only; not an official NVIDIA passing score.</p><button onclick="exam=null;render()">Back to exams</button></div><h2>Question review</h2>${exam.questions.map((q,i)=>`<div class="card"><strong>${i+1}. ${esc(q.q)}</strong><p>${q.options[exam.answers[i]]?.ok?'✓ Correct':'✕ Incorrect'}</p><p>Answer: ${esc(q.options.find(x=>x.ok).t)}</p><p>${esc(q.why)}</p></div>`).join('')}`;let q=exam.questions[exam.i];return `<h1>Mock exam ${exam.n+1}</h1><p>Question ${exam.i+1}/${exam.questions.length}</p><div class="card"><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="option ${exam.answers[exam.i]===i?'chosen':''}" onclick="exam.answers[exam.i]=${i};render()">${String.fromCharCode(65+i)}. ${esc(o.t)}</button>`).join('')}<div class="actions"><button onclick="exam.i=Math.max(0,exam.i-1);render()">Previous</button><button onclick="exam.i=Math.min(exam.questions.length-1,exam.i+1);render()">Next</button><button class="primary" onclick="submitQuestions()">Submit questions → 3 labs</button></div></div>`}return ''}function render(){document.getElementById('app').innerHTML=tabs()+`<main>${content()}</main>`}render();</script></body></html>
